services:
  hub-dashboard:
    build:
      context: .
      dockerfile: deploy/hub-dashboard/Dockerfile
    restart: unless-stopped
    init: true
    ports:
      - '127.0.0.1:${HUB_DASHBOARD_PORT:-8769}:8769'
    environment:
      HUB_DASHBOARD_PORT: ${HUB_DASHBOARD_PORT:-8769}
    volumes:
      - type: bind
        source: ${SKILL_HUB_CONTENT_DIR:-./examples/hub}
        target: /hub
        read_only: true
        bind:
          create_host_path: false
      - dashboard-state:/state
    read_only: true
    tmpfs:
      - /tmp:size=268435456,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1
    pids_limit: 64
    healthcheck:
      test: ['CMD', 'python', '-c', "import os,urllib.request; r=urllib.request.Request('http://127.0.0.1:8769/',headers={'Host':'127.0.0.1:'+os.environ['HUB_DASHBOARD_PORT']}); urllib.request.urlopen(r,timeout=3).read(1)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '3'
volumes:
  dashboard-state:
