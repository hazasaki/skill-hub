<?xml version='1.0' encoding='utf-8'?>
<svg aria-labelledby="title desc" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" role="img"><title id="title">Skill Hub architecture</title><desc id="desc">Authored skills and prompts feed a local catalog. The dashboard and MCP clients read the catalog and receive resources.</desc><rect x="0" y="0" width="960" height="330" rx="12" fill="#102631" /><text font-family="system-ui, sans-serif" font-size="31" x="32" y="46" fill="#eaf3f3">Skill Hub</text><text font-family="system-ui, sans-serif" font-size="17" x="32" y="77" fill="#acc4ca">From authored files to instructions an agent can use</text><rect x="32" y="110" width="200" height="165" rx="12" fill="#20414c" /><text font-family="system-ui, sans-serif" font-size="22" x="47" y="146" fill="#9fe6cf">Source files</text><text font-family="system-ui, sans-serif" font-size="14" x="47" y="179" fill="#eaf3f3">Skill directories</text><text font-family="system-ui, sans-serif" font-size="14" x="47" y="205" fill="#eaf3f3">Prompt documents</text><text font-family="system-ui, sans-serif" font-size="14" x="47" y="231" fill="#eaf3f3">Supporting files</text><text font-family="system-ui, sans-serif" font-size="22" x="236" y="201" fill="#9fe6cf">→</text><rect x="264" y="110" width="200" height="165" rx="12" fill="#20414c" /><text font-family="system-ui, sans-serif" font-size="22" x="279" y="146" fill="#9fe6cf">Catalog</text><text font-family="system-ui, sans-serif" font-size="14" x="279" y="179" fill="#eaf3f3">Index on startup</text><text font-family="system-ui, sans-serif" font-size="14" x="279" y="205" fill="#eaf3f3">SQLite + full-text search</text><text font-family="system-ui, sans-serif" font-size="14" x="279" y="231" fill="#eaf3f3">Resource identity</text><text font-family="system-ui, sans-serif" font-size="22" x="468" y="201" fill="#9fe6cf">→</text><rect x="496" y="110" width="200" height="165" rx="12" fill="#20414c" /><text font-family="system-ui, sans-serif" font-size="22" x="511" y="146" fill="#9fe6cf">Access</text><text font-family="system-ui, sans-serif" font-size="14" x="511" y="179" fill="#eaf3f3">Dashboard on :8769</text><text font-family="system-ui, sans-serif" font-size="14" x="511" y="205" fill="#eaf3f3">MCP on :8765/mcp</text><text font-family="system-ui, sans-serif" font-size="14" x="511" y="231" fill="#eaf3f3">List, search and load</text><text font-family="system-ui, sans-serif" font-size="22" x="700" y="201" fill="#9fe6cf">→</text><rect x="728" y="110" width="200" height="165" rx="12" fill="#20414c" /><text font-family="system-ui, sans-serif" font-size="22" x="743" y="146" fill="#9fe6cf">Use</text><text font-family="system-ui, sans-serif" font-size="14" x="743" y="179" fill="#eaf3f3">Inspect the resource</text><text font-family="system-ui, sans-serif" font-size="14" x="743" y="205" fill="#eaf3f3">Read its full instructions</text><text font-family="system-ui, sans-serif" font-size="14" x="743" y="231" fill="#eaf3f3">Apply and verify</text><text font-family="system-ui, sans-serif" font-size="15" x="32" y="307" fill="#acc4ca">Local quickstart  /  Docker Compose  /  read-only content mounts</text></svg>