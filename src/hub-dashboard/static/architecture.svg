<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" role="img" aria-labelledby="title description">
  <title id="title">Skill Hub architecture</title>
  <desc id="description">Local skills and prompts feed a SQLite catalog. The Dashboard reads counts, resources and recorded relationships through its local API. The Hub can also rank candidates for a task. Its menu allows a client to decline or select items. A verified load checks access, dependencies and hashes before delivering source text.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#7c88a4"/>
    </marker>
  </defs>
  <rect width="940" height="560" rx="22" fill="#111827"/>
  <g font-family="system-ui, sans-serif">
    <text x="36" y="56" fill="#f8fafc" font-size="31" font-weight="700">Skill Hub architecture</text>
    <g fill="#1d293d" stroke="#465673">
      <rect x="36" y="110" width="236" height="92" rx="12"/>
      <rect x="352" y="110" width="236" height="92" rx="12"/>
      <rect x="668" y="110" width="236" height="92" rx="12"/>
      <rect x="352" y="282" width="236" height="92" rx="12"/>
      <rect x="36" y="436" width="236" height="88" rx="12"/>
      <rect x="352" y="436" width="236" height="88" rx="12"/>
      <rect x="668" y="436" width="236" height="88" rx="12"/>
    </g>
    <g fill="none" stroke="#7c88a4" stroke-width="2" marker-end="url(#arrow)">
      <path d="M276 156H342"/>
      <path d="M592 156H658"/>
      <path d="M470 206V272"/>
      <path d="M470 378V406H154V426"/>
      <path d="M276 480H342"/>
      <path d="M592 480H658"/>
    </g>
    <g font-size="20" font-weight="650" fill="#c7d2fe">
      <text x="54" y="145">Content library</text>
      <text x="370" y="145">Local catalog</text>
      <text x="686" y="145">Dashboard</text>
      <text x="370" y="317">Task routing</text>
      <text x="54" y="469">Resource menu</text>
      <text x="370" y="469">Verified load</text>
      <text x="686" y="469">Resource contents</text>
    </g>
    <g font-size="15.5" fill="#e2e8f0">
      <text x="54" y="176">Skills and prompts</text>
      <text x="370" y="176">SQLite index</text>
      <text x="686" y="176">Browse and explore links</text>
      <text x="370" y="348">Rank for the task</text>
      <text x="54" y="500">Client chooses zero or more</text>
      <text x="370" y="496">Check access, dependencies</text>
      <text x="370" y="515">and hashes</text>
      <text x="686" y="500">Deliver original text</text>
    </g>
    <g font-size="15" fill="#bac7df">
      <text x="620" y="128" text-anchor="middle">Local API</text>
      <text x="485" y="247">Optional model provider</text>
    </g>
  </g>
</svg>
